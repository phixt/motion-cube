<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>MotionCube 图标实验室 · 观察角度与 F/B 转动</title>
<style>
  :root {
    --accent: #0078d4;
    --panel-bg: rgba(243, 243, 243, 0.92);
    --card: #fbfbfb;
    --stroke: #e5e5e5;
    --text: #1a1a1a;
    --text2: #5d5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  body { background: repeating-conic-gradient(#e9e9e9 0% 25%, #ffffff 0% 50%) 0 / 28px 28px; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel {
    position: fixed; top: 12px; right: 12px; bottom: 12px; width: 330px;
    background: var(--panel-bg); border: 1px solid var(--stroke); border-radius: 8px;
    backdrop-filter: blur(16px); box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 14px 16px; overflow-y: auto; font-size: 13px;
  }
  #panel h1 { font-size: 16px; margin: 2px 0 2px; font-weight: 600; }
  #panel .sub { color: var(--text2); font-size: 11.5px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { flex: 0 0 auto; color: var(--text2); }
  .row output { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  select { flex: 1; padding: 4px 6px; border: 1px solid var(--stroke); border-radius: 4px; background: #fff; font: inherit; }
  button {
    font: inherit; padding: 5px 10px; border: 1px solid var(--stroke); border-radius: 4px;
    background: #fff; cursor: pointer; transition: background .1s;
  }
  button:hover { background: #f0f6fc; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1a86d9; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  #readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; font-variant-numeric: tabular-nums; }
  #readout b { font-weight: 600; }
  #readout span { color: var(--text2); font-size: 11px; display: block; }
  .hint { color: var(--text2); font-size: 11.5px; line-height: 1.5; }
  #copied { color: #107c10; font-size: 12px; visibility: hidden; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<aside id="panel">
  <h1>MotionCube 图标实验室</h1>
  <div class="sub">拖拽旋转视角 · 滚轮缩放（dist）· 调 F/B 转角与配色，满意后「复制参数」发给我</div>

  <div class="card">
    <div class="row"><label>配色</label>
      <select id="palette">
        <option value="gray">① 灰阶（观察形体）</option>
        <option value="lightDeep" selected>② WinUI 浅色 · 深塑体（推荐）</option>
        <option value="lightPale">③ WinUI 浅色 · 浅塑体</option>
        <option value="dark">④ 深色板 · 冷光蓝</option>
        <option value="uninstall">⑤ 卸载图标（深底 · F 面警示红）</option>
      </select>
    </div>
    <div class="row"><label>底板</label>
      <select id="plate">
        <option value="auto" selected>跟随配色</option>
        <option value="none">无（透明棋盘格）</option>
      </select>
      <output id="plateHex"></output>
    </div>
  </div>

  <div class="card">
    <div class="row"><label>F 转动</label><input type="range" id="fAngle" min="-180" max="180" step="0.5" value="24"><output id="fOut">24°</output></div>
    <div class="row"><label>B 转动</label><input type="range" id="bAngle" min="-180" max="180" step="0.5" value="10"><output id="bOut">10°</output></div>
    <div class="row"><label>FOV</label><input type="range" id="fov" min="12" max="75" step="1" value="30"><output id="fovOut">30°</output></div>
    <div class="hint">F 正 = 从前面看顺时针；B 正 = 从后面看顺时针。</div>
  </div>

  <div class="card">
    <div class="row"><label>视角预设</label></div>
    <div class="btns">
      <button data-view="33,27">3/4 标准</button>
      <button data-view="22,38">偏正</button>
      <button data-view="40,30">高角</button>
      <button data-view="12,45">低角</button>
      <button data-view="30,-32">看 B 面</button>
      <button data-view="55,45">近俯视</button>
    </div>
    <div class="btns" style="margin-top:8px">
      <button id="resetTurn">F/B 归零</button>
      <button class="primary" id="copy">复制参数 JSON</button><span id="copied">已复制 ✓</span>
    </div>
    <div class="btns" style="margin-top:6px">
      <button id="export">导出 PNG 1024（含底板）</button>
    </div>
  </div>

  <div class="card">
    <div id="readout">
      <div><span>Elev</span><b id="rElev">–</b></div>
      <div><span>Azim</span><b id="rAzim">–</b></div>
      <div><span>Dist</span><b id="rDist">–</b></div>
      <div><span>F</span><b id="rF">–</b></div>
      <div><span>B</span><b id="rB">–</b></div>
      <div><span>FOV</span><b id="rFov">–</b></div>
    </div>
    <div class="hint" style="margin-top:8px">约定：Y 轴向上，F 面 = +Z，R 面 = +X；Azim 0° 正对 F，正值向 R 面转；Elev 为正即俯视。生成脚本用同一套约定复现，并按投影自动居中裁切，所以 Dist 只影响透视强弱，不决定大小。</div>
  </div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 调色板（单一蓝色系，不同明度；贴纸色跟随块面，不跟随光照） ----------
const PALETTES = {
  gray: {
    name: '灰阶',
    F: '#f0f0f0', U: '#ffffff', R: '#d2d2d2', L: '#bfbfbf', D: '#9a9a9a', B: '#8a8a8a',
    body: '#4a4f55', plate: '#f3f3f3', border: '#e0e0e0',
  },
  lightDeep: {
    name: 'WinUI浅色·深塑体',
    F: '#0f83d9', U: '#59aeea', R: '#0b6bb2', L: '#0a5c99', D: '#084a7d', B: '#073c66',
    body: '#16293a', plate: '#f3f3f3', border: '#e0e0e0',
  },
  lightPale: {
    name: 'WinUI浅色·浅塑体',
    F: '#0f83d9', U: '#59aeea', R: '#0b6bb2', L: '#0a5c99', D: '#084a7d', B: '#073c66',
    body: '#e7eef4', plate: '#f3f3f3', border: '#e0e0e0',
  },
  dark: {
    name: '深色板',
    F: '#3da0e4', U: '#7cc4f2', R: '#2b7fbe', L: '#226a9f', D: '#1a5680', B: '#15486b',
    body: '#0b1622', plate: '#202020', border: '#333333',
  },
  uninstall: {
    name: '卸载·警示红',
    F: '#c42b1c', U: '#5f7f9b', R: '#33506a', L: '#2c4860', D: '#243c50', B: '#1d3345',
    body: '#101820', plate: '#272727', border: '#3b3b3b',
  },
};

// ---------- 建模约定（与后续 python 生成脚本一致） ----------
// y 向上，F 面 = +z，R 面 = +x。cubie 尺寸 1，间隙 g。
const G = 0.03, STEP = 1 + 2 * G;
const STICKER = 0.86, CORNER = 0.13, E = 0.502;

const faceXf = {
  F: [ 0, 0,  E, 0, 0, 0 ],
  B: [ 0, 0, -E, 0, Math.PI, 0 ],
  R: [ E, 0, 0, 0,  Math.PI / 2, 0 ],
  L: [-E, 0, 0, 0, -Math.PI / 2, 0 ],
  U: [ 0,  E, 0, -Math.PI / 2, 0, 0 ],
  D: [ 0, -E, 0,  Math.PI / 2, 0, 0 ],
};

function roundedRectShape(a, r) {
  const s = new THREE.Shape(), h = a / 2;
  s.moveTo(-h + r, -h);
  s.lineTo(h - r, -h);  s.quadraticCurveTo(h, -h, h, -h + r);
  s.lineTo(h, h - r);   s.quadraticCurveTo(h, h, h - r, h);
  s.lineTo(-h + r, h);  s.quadraticCurveTo(-h, h, -h, h - r);
  s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h);
  return s;
}

const stickerGeo = new THREE.ShapeGeometry(roundedRectShape(STICKER, CORNER), 8);
const bodyGeo = new THREE.BoxGeometry(1, 1, 1);
const faceMats = {};
for (const k of Object.keys(faceXf)) faceMats[k] = new THREE.MeshBasicMaterial({ color: PALETTES.lightDeep[k], side: THREE.DoubleSide });
const bodyMat = new THREE.MeshBasicMaterial({ color: PALETTES.lightDeep.body });

function makeCubie(ix, iy, iz) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(bodyGeo, bodyMat));
  const addSticker = (kind, axis, sign) => {
    const c = axis === 'x' ? ix : axis === 'y' ? iy : iz;
    if (c !== sign) return;
    const m = new THREE.Mesh(stickerGeo, faceMats[kind]);
    const [x, y, z, rx, ry, rz] = faceXf[kind];
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
    g.add(m);
  };
  addSticker('F', 'z', 1); addSticker('B', 'z', -1); addSticker('R', 'x', 1);
  addSticker('L', 'x', -1); addSticker('U', 'y', 1); addSticker('D', 'y', -1);
  g.position.set(ix * STEP, iy * STEP, iz * STEP);
  return g;
}

const core = new THREE.Group(), fLayer = new THREE.Group(), bLayer = new THREE.Group();
for (let ix = -1; ix <= 1; ix++) for (let iy = -1; iy <= 1; iy++) for (let iz = -1; iz <= 1; iz++) {
  if (!ix && !iy && !iz) continue;
  (iz === 1 ? fLayer : iz === -1 ? bLayer : core).add(makeCubie(ix, iy, iz));
}

// ---------- 场景 ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.add(core, fLayer, bLayer);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const DEFAULT_VIEW = { azim: 33, elev: 27, dist: 11.5 };
function setCamera({ azim, elev, dist }) {
  const a = THREE.MathUtils.degToRad(azim), e = THREE.MathUtils.degToRad(elev);
  camera.position.set(dist * Math.cos(e) * Math.sin(a), dist * Math.sin(e), dist * Math.cos(e) * Math.cos(a));
  camera.lookAt(0, 0, 0);
}
setCamera(DEFAULT_VIEW);

const controls = new OrbitControls(camera, canvas);
controls.enablePan = false;
controls.enableDamping = true;
controls.minDistance = 3.2;
controls.maxDistance = 24;

// 底板（跟随配色的圆角方块，仅作预览；导出时以 2D 方式合成）
let plateHex = '';
function applyPalette(id) {
  const p = PALETTES[id];
  for (const k of Object.keys(faceMats)) faceMats[k].color.set(p[k]);
  bodyMat.color.set(p.body);
  plateHex = document.getElementById('plate').value === 'none' ? '' : p.plate;
  document.body.style.background = plateHex ? '' : 'repeating-conic-gradient(#e9e9e9 0% 25%, #ffffff 0% 50%) 0 / 28px 28px';
  canvas.style.background = plateHex || 'transparent';
  document.getElementById('plateHex').textContent = plateHex;
}

// ---------- 参数状态 ----------
const $ = (id) => document.getElementById(id);
const state = { palette: 'lightDeep' };
function readParams() {
  const r = camera.position.length();
  const elev = THREE.MathUtils.radToDeg(Math.asin(camera.position.y / r));
  const azim = THREE.MathUtils.radToDeg(Math.atan2(camera.position.x, camera.position.z));
  return {
    elev: +elev.toFixed(1), azim: +azim.toFixed(1), dist: +r.toFixed(2),
    fov: +$('fov').value, fAngle: +$('fAngle').value, bAngle: +$('bAngle').value,
    palette: state.palette, plate: plateHex || 'none',
  };
}
function syncLabels() {
  $('fOut').textContent = $('fAngle').value + '°';
  $('bOut').textContent = $('bAngle').value + '°';
  $('fovOut').textContent = $('fov').value + '°';
  const p = readParams();
  $('rElev').textContent = p.elev; $('rAzim').textContent = p.azim; $('rDist').textContent = p.dist;
  $('rF').textContent = p.fAngle + '°'; $('rB').textContent = p.bAngle + '°'; $('rFov').textContent = p.fov + '°';
}

$('fAngle').oninput = () => { fLayer.rotation.z = -THREE.MathUtils.degToRad(+$('fAngle').value); syncLabels(); };
$('bAngle').oninput = () => { bLayer.rotation.z =  THREE.MathUtils.degToRad(+$('bAngle').value); syncLabels(); };
$('fov').oninput = () => { camera.fov = +$('fov').value; camera.updateProjectionMatrix(); syncLabels(); };
$('palette').onchange = (e) => { state.palette = e.target.value; applyPalette(state.palette); syncLabels(); };
$('plate').onchange = () => applyPalette(state.palette);
$('resetTurn').onclick = () => { $('fAngle').value = 0; $('bAngle').value = 0; $('fAngle').oninput(); $('bAngle').oninput(); };
document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => {
  const [az, el] = b.dataset.view.split(',').map(Number);
  setCamera({ azim: az, elev: el, dist: camera.position.length() });
});

$('copy').onclick = async () => {
  await navigator.clipboard.writeText(JSON.stringify(readParams(), null, 0));
  $('copied').style.visibility = 'visible';
  setTimeout(() => ($('copied').style.visibility = 'hidden'), 1500);
};

$('export').onclick = () => {
  const S = 1024, prevW = canvas.clientWidth, prevH = canvas.clientHeight;
  renderer.setSize(S, S, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const out = document.createElement('canvas'); out.width = out.height = S;
  const ctx = out.getContext('2d');
  if (plateHex) { // WinUI 圆角方块底板
    const r = S * 0.22, pad = 0;
    ctx.beginPath();
    ctx.roundRect(pad, pad, S - 2 * pad, S - 2 * pad, r);
    ctx.fillStyle = plateHex; ctx.fill();
  }
  ctx.drawImage(renderer.domElement, 0, 0, S, S);
  renderer.setSize(prevW, prevH, false);
  camera.aspect = prevW / prevH; camera.updateProjectionMatrix();
  const a = document.createElement('a');
  a.download = `icon-preview-${state.palette}.png`;
  a.href = out.toDataURL('image/png');
  a.click();
};

// ---------- URL 参数（供截图脚本/分享预设使用） ----------
{
  const q = new URLSearchParams(location.search);
  const pal = q.get('palette');
  if (pal && PALETTES[pal]) { state.palette = pal; $('palette').value = pal; }
  for (const [k, id] of [['f', 'fAngle'], ['b', 'bAngle'], ['fov', 'fov']])
    if (q.get(k) !== null) $(id).value = q.get(k);
  if (q.get('plate') === 'none') $('plate').value = 'none';
  if (q.get('bare')) document.getElementById('panel').style.display = 'none';
  const view = {
    azim: +(q.get('azim') ?? DEFAULT_VIEW.azim),
    elev: +(q.get('elev') ?? DEFAULT_VIEW.elev),
    dist: +(q.get('dist') ?? DEFAULT_VIEW.dist),
  };
  setCamera(view);
  camera.fov = +$('fov').value; camera.updateProjectionMatrix();
}

// ---------- 渲染循环 ----------
function resize() {
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
applyPalette(state.palette);
$('fAngle').oninput(); $('bAngle').oninput();

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); syncLabels(); });
</script>
</body>
</html>
