name: Release (Windows NSIS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag name (e.g. v0.4.3); leave empty to build artifact only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Tauri NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package / tauri / Cargo versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart("v")
          node -e '
            const fs = require("node:fs");
            const tag = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8")).version;
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargo = (fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m) || [])[1];
            const map = { tag, "package.json": pkg, "package-lock.json": lock, "tauri.conf.json": tauri, "Cargo.toml": cargo };
            if (new Set(Object.values(map)).size !== 1) {
              console.error("Release version mismatch:", map);
              process.exit(1);
            }
            console.log("Release version synced:", tag);
          ' "$tagVer"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri NSIS installer (unsigned)
        run: npm run tauri build

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-cube-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No NSIS installer found" }
          gh release create "${{ github.ref_name }}" $files --generate-notes --title "Motion Cube ${{ github.ref_name }}"
