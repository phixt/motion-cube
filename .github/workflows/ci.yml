name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck + Build + Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify data
        run: npx tsx scripts/verify-data.ts

      - name: Verify hand mesh
        run: npx tsx scripts/verify-hand-mesh.ts

      - name: Solver + render + coverage smoke (native Node, strip-types)
        # node scripts/*.ts 直跑（Node 22 strip-types，无 tsx/esbuild 依赖，Linux 可跑）
        run: |
          node scripts/smoke-solver.ts
          node scripts/smoke-solver-edge.ts
          node scripts/verify-render-cube.ts
          node scripts/verify-zbll-coverage.ts
